<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Hidden Gems of Oxford - Contact</title>
    <link rel="stylesheet" href="Styles/main.css">
    <link rel="Stylesheet" href="styles/contact.css">
</head>

<body>
    <div class="wrapper">
        <!--header-->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="information.html">Oxford Hidden Gems</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="contact.html" class="current">Contact Us</a></li>
            </ul>
        </nav>
        <section class="contact">
            <article>
                <h1>Contact Us</h1>
                <form class="contact-form" action="https://formspree.io/f/xwlvoand" method="POST">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your Full Name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your Email Address" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Your Phone Number" required>
                    </div>

                    <div class="form-group">
                        <label for="tovisit">What place do you plan on visiting?</label>
                        <select name="tovisit" id="tovisit" placeholder="Your Choice" required>
                            <option value="bar">Bar 1886</option>
                            <option value="peffer">Peffer Park</option>
                            <option value="course">Disc Golf Course</option>
                            <option value="treats">Spring Street Treats</option>
                            <option value="putt">Puzzle &amp; Putt</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Question</label>
                        <textarea id="message" name="message" rows="5" placeholder="Your Message..." required></textarea>
                    </div>

                    <button type="submit" class="btn">Send Message</button>
                </form>
            </article>
        </section>
        <footer>
            <div class="footer">
                <p>&copy; BLJS Co. All rights reserved.</p>
            </div>
        </footer>
    </div>
</body>

</html>
